<!DOCTYPE html>
<html>
<head>
    <title>Sigma Slope | Pro Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; background: #0b0e14; overflow: hidden; font-family: sans-serif; }
        #menu, #death-screen {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #00d4ff; text-align: center; z-index: 10;
            background: rgba(0,0,0,0.95); padding: 30px; border-radius: 15px; border: 2px solid #00d4ff; width: 280px;
        }
        #death-screen { display: none; border-color: #ff4444; color: #ff4444; }
        .btn { 
            padding: 12px; margin: 10px 0; border: none; border-radius: 8px; 
            font-weight: bold; cursor: pointer; font-size: 16px; width: 100%; display: block;
            transition: 0.2s;
        }
        .play-btn { background: #00d4ff; color: #000; }
        .play-btn:hover { background: #fff; }
        .fs-btn { background: #6e45e2; color: #fff; }
        .exit-btn { background: #30363d; color: #fff; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: #fff; font-size: 24px; font-weight: bold; text-shadow: 2px 2px #000; }
    </style>
</head>
<body>
    <div id="ui">SCORE: <span id="score">0</span></div>

    <div id="menu">
        <h1 style="margin-top:0">SIGMA SLOPE</h1>
        <p style="color:#ccc; font-size:12px">WASD / ARROWS TO STEER</p>
        <button class="btn play-btn" onclick="startGame()">START GAME</button>
        <button class="btn fs-btn" onclick="toggleFullScreen()">FULL SCREEN</button>
    </div>

    <div id="death-screen">
        <h1 style="margin-top:0">GAME OVER</h1>
        <p>Keep playing?</p>
        <button class="btn play-btn" onclick="restartGame()">YES (RESTART)</button>
        <button class="btn fs-btn" onclick="toggleFullScreen()">FULL SCREEN</button>
        <button class="btn exit-btn" onclick="exitToHub()">NO (EXIT)</button>
    </div>

    <script>
        let scene, camera, renderer, ball, platforms = [];
        let gameStarted = false, score = 0, speed = 0.55, keys = {};

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Create the Player Ball
            const ballGeo = new THREE.SphereGeometry(0.5, 32, 32);
            const ballMat = new THREE.MeshPhongMaterial({ color: 0x00d4ff, shininess: 100 });
            ball = new THREE.Mesh(ballGeo, ballMat);
            ball.position.y = 1;
            scene.add(ball);

            // Generate Endless-style Track
            for(let i=0; i<100; i++) {
                const platGeo = new THREE.BoxGeometry(7, 0.5, 10);
                const platMat = new THREE.MeshPhongMaterial({ color: 0x1c2128 });
                const plat = new THREE.Mesh(platGeo, platMat);
                // Creates the downward slope angle
                plat.position.set(0, -i * 1.5, -i * 10);
                scene.add(plat);
                platforms.push(plat);
            }

            // Lighting
            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(5, 10, 7.5);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x404040));

            camera.position.set(0, 5, 10);

            // Keyboard Listeners
            window.addEventListener('keydown', (e) => { keys[e.code] = true; });
            window.addEventListener('keyup', (e) => { keys[e.code] = false; });
            
            animate();
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function startGame() {
            gameStarted = true;
            document.getElementById('menu').style.display = 'none';
        }

        function restartGame() {
            ball.position.set(0, 1, 0);
            score = 0;
            document.getElementById('score').innerText = "0";
            document.getElementById('death-screen').style.display = 'none';
            gameStarted = true;
        }

        function exitToHub() {
            if (document.fullscreenElement) document.exitFullscreen();
            // This refreshes the main hub page
            window.parent.location.reload();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (gameStarted) {
                // Constant forward and downward speed
                ball.position.z -= speed;
                ball.position.y -= speed * 0.15;

                // Steering Logic (WASD + Arrows)
                if (keys['ArrowLeft'] || keys['KeyA']) ball.position.x -= 0.18;
                if (keys['ArrowRight'] || keys['KeyD']) ball.position.x += 0.18;

                // Death Logic (Falling off)
                if (ball.position.y < (ball.position.z * 0.15) - 10 || Math.abs(ball.position.x) > 4) {
                    gameStarted = false;
                    document.getElementById('death-screen').style.display = 'block';
                }

                score = Math.floor(Math.abs(ball.position.z));
                document.getElementById('score').innerText = score;
            }
            
            // Camera follow
            camera.position.z = ball.position.z + 8;
            camera.position.y = ball.position.y + 4;
            camera.lookAt(ball.position);
            
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>

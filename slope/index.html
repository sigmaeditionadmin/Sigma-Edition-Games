<!DOCTYPE html>
<html>
<head>
    <style>
        body { background-color: black; color: #00d4ff; font-family: sans-serif; text-align: center; margin: 0; overflow: hidden; }
        .menu { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 15px; }
        button { width: 280px; padding: 15px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; font-size: 18px; transition: 0.2s; }
        .start-btn { background-color: #00d4ff; color: black; }
        .full-btn { background-color: #6e45e2; color: white; }
        .hub-btn { background-color: #30363d; color: white; }
        button:hover { transform: scale(1.05); filter: brightness(1.2); }
        
        #game-container { display: none; width: 100vw; height: 100vh; flex-direction: column; }
        #game-area { flex-grow: 1; width: 100%; border: none; }
        .footer-bar { height: 40px; background: #161b22; display: flex; justify-content: center; align-items: center; border-top: 2px solid #00d4ff; }
        .exit-fs-btn { background: none; color: #00d4ff; border: 1px solid #00d4ff; padding: 5px 15px; font-size: 12px; width: auto; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="menu" id="main-menu">
        <h1>SLOPE | SIGMA</h1>
        <button class="start-btn" onclick="startGame()">START GAME</button>
        <button class="full-btn" onclick="toggleFS()">FULL SCREEN</button>
        <button class="hub-btn" onclick="window.parent.location.reload();">BACK TO HUB</button>
    </div>

    <div id="game-container">
        <iframe id="game-area" src="https://pizzaedition.win/games/slope/" allow="fullscreen"></iframe>
        <div class="footer-bar">
            <button class="exit-fs-btn" onclick="toggleFS()">EXIT FULLSCREEN</button>
        </div>
    </div>

    <script>
        function startGame() {
            document.getElementById('main-menu').style.display = 'none';
            const container = document.getElementById('game-container');
            container.style.display = 'flex';
            document.getElementById('game-area').focus();
        }

        function toggleFS() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }
    </script>
</body>
</html>

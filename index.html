<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma Edition | Game Hub</title>
    <style>
        :root { --primary: #00d4ff; --bg: #0b0e14; --card-bg: #1c2128; --text: #f0f6fc; }
        body { background-color: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; text-align: center; overflow-x: hidden; }
        header { padding: 40px; background: linear-gradient(135deg, #6e45e2, var(--primary)); border-radius: 20px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .game-card { background: var(--card-bg); border-radius: 15px; border: 1px solid #30363d; overflow: hidden; height: 380px; transition: 0.3s; }
        .game-card:hover { border-color: var(--primary); transform: translateY(-5px); }
        .game-box { position: relative; width: 100%; height: 300px; background: #000; display: flex; align-items: center; justify-content: center; }
        .game-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; display: none; }
        .play-btn { padding: 15px 35px; background: var(--primary); color: #000; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; z-index: 10; font-size: 18px; box-shadow: 0 5px 15px rgba(0,212,255,0.4); }
        .play-btn:hover { background: #fff; scale: 1.05; }
        .game-label { padding: 20px; font-weight: bold; background: #161b22; color: var(--primary); letter-spacing: 1px; }
    </style>
</head>
<body>

<header>
    <h1>SIGMA EDITION HUB</h1>
    <p>v1.0 - 2026 Collection</p>
</header>

<div class="game-grid">
    <div class="game-card">
        <div class="game-box">
            <button class="play-btn" onclick="launchGame(this, './slope/index.html')">PLAY SLOPE</button>
            <iframe allow="fullscreen"></iframe>
        </div>
        <div class="game-label">SLOPE (SIGMA LITE)</div>
    </div>

    <div class="game-card" style="opacity: 0.6;">
        <div class="game-box">
            <button class="play-btn" style="background: #444; cursor: not-allowed;">COMING SOON</button>
        </div>
        <div class="game-label">SPACE WAVES</div>
    </div>
</div>

<script>
    function launchGame(btn, gameUrl) {
        const container = btn.parentElement;
        const frame = container.querySelector('iframe');
        
        // Hide button, show frame, load game
        btn.style.display = 'none';
        frame.style.display = 'block';
        frame.src = gameUrl;
        
        console.log("Loading game from: " + gameUrl);
    }
</script>

</body>
</html>

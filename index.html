<!DOCTYPE html>
<html>
<head>
    <title>Sigma Hub</title>
    <style>
        body { background: #0b0e14; color: white; font-family: sans-serif; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; padding: 20px; }
        .card { background: #1c2128; border: 2px solid #30363d; border-radius: 15px; height: 350px; overflow: hidden; }
        .box { position: relative; width: 100%; height: 280px; background: #000; display: flex; align-items: center; justify-content: center; }
        iframe { width: 100%; height: 100%; border: none; display: none; }
        .btn { padding: 15px 30px; background: #00d4ff; color: black; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; z-index: 10; }
        .label { padding: 15px; font-weight: bold; color: #00d4ff; }
    </style>
</head>
<body>
    <h1>SIGMA HUB v1.0</h1>
    <div class="grid">
        <div class="card">
            <div class="box">
                <button class="btn" onclick="runGame(this, './slope/index.html')">PLAY SLOPE</button>
                <iframe allow="fullscreen"></iframe>
            </div>
            <div class="label">SLOPE</div>
        </div>
    </div>

    <script>
        function runGame(btn, url) {
            const frame = btn.parentElement.querySelector('iframe');
            btn.style.display = 'none';
            frame.style.display = 'block';
            frame.src = url;
            console.log("Launching: " + url);
        }
    </script>
</body>
</html>

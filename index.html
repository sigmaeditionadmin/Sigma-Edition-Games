<!DOCTYPE html>
<html>
<head>
    <title>Sigma Edition Hub</title>
    <style>
        body { background: #0b0e14; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .grid { display: flex; justify-content: center; margin-top: 50px; }
        .card { 
            background: #1c2128; border: 2px solid #00d4ff; border-radius: 15px; 
            width: 400px; height: 350px; overflow: hidden; position: relative;
        }
        .view { width: 100%; height: 280px; background: #000; display: flex; align-items: center; justify-content: center; }
        iframe { width: 100%; height: 100%; border: none; display: none; }
        .play-btn { 
            padding: 15px 30px; background: #00d4ff; color: black; border: none; 
            border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 18px;
        }
        .title { padding: 15px; font-weight: bold; color: #00d4ff; }
    </style>
</head>
<body>

    <h1>SIGMA HUB v1.0</h1>

    <div class="grid">
        <div class="card">
            <div class="view">
                <button class="play-btn" onclick="this.style.display='none'; this.nextElementSibling.style.display='block'; this.nextElementSibling.src='./slope/index.html'">PLAY SLOPE</button>
                <iframe allow="fullscreen"></iframe>
            </div>
            <div class="title">SLOPE</div>
        </div>
    </div>

</body>
</html>

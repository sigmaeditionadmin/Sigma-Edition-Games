<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sigma Hub</title>
    <style>
        body { background: #0b0e14; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .game-grid { display: flex; justify-content: center; margin-top: 50px; }
        .card { 
            background: #1c2128; border: 2px solid #30363d; border-radius: 15px; 
            width: 320px; height: 400px; overflow: hidden; display: flex; flex-direction: column;
        }
        .view { position: relative; flex-grow: 1; background: #000; display: flex; align-items: center; justify-content: center; }
        iframe { width: 100%; height: 100%; border: none; display: none; }
        .play-btn { 
            padding: 15px 30px; background: #00d4ff; color: #000; border: none; 
            border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 18px;
        }
        .play-btn:hover { background: #fff; }
        .footer { padding: 15px; background: #161b22; color: #00d4ff; font-weight: bold; }
    </style>
</head>
<body>

    <h1>SIGMA HUB v1.0</h1>

    <div class="game-grid">
        <div class="card">
            <div class="view">
                <button class="play-btn" onclick="this.style.display='none'; this.nextElementSibling.style.display='block'; this.nextElementSibling.src='./slope/index.html'">PLAY SLOPE</button>
                <iframe allow="fullscreen"></iframe>
            </div>
            <div class="footer">SLOPE</div>
        </div>
    </div>

</body>
</html>

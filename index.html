<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma Edition | Hub</title>
    <style>
        :root { --primary: #00d4ff; --bg: #0b0e14; --card-bg: #1c2128; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; text-align: center; }
        
        header { padding: 30px; margin-bottom: 40px; background: #161b22; border-bottom: 3px solid var(--primary); border-radius: 0 0 20px 20px; }
        h1 { margin: 0; letter-spacing: 2px; text-shadow: 0 0 10px var(--primary); }

        .game-grid { 
            display: flex; 
            justify-content: center; 
            gap: 25px; 
            flex-wrap: wrap; 
            max-width: 1200px; 
            margin: 0 auto; 
        }
        
        .game-card { 
            background: var(--card-bg); 
            border: 2px solid #30363d; 
            border-radius: 15px; 
            width: 320px; 
            height: 400px; 
            overflow: hidden; 
            transition: 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .game-card:hover { border-color: var(--primary); transform: translateY(-8px); }

        .game-preview { 
            position: relative; 
            flex-grow: 1; 
            background: #000; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        /* This hides the iframe until you click Play */
        iframe { width: 100%; height: 100%; border: none; display: none; }

        .play-btn { 
            padding: 12px 30px; 
            background: var(--primary); 
            color: #000; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 16px;
            transition: 0.2s;
            z-index: 5;
        }
        .play-btn:hover { background: #fff; transform: scale(1.1); }

        .game-title { 
            padding: 15px; 
            background: #161b22; 
            color: var(--primary); 
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <header>
        <h1>SIGMA EDITION HUB</h1>
    </header>

    <div class="game-grid">
        <div class="game-card">
            <div class="game-preview">
                <button class="play-btn" onclick="startSigmaGame(this, './slope/index.html')">PLAY SLOPE</button>
                <iframe allow="fullscreen"></iframe>
            </div>
            <div class="game-title">SLOPE (PRO)</div>
        </div>

        <div class="game-card" style="opacity: 0.4;">
            <div class="game-preview">
                <span style="color: #666; font-weight: bold;">LOCKED</span>
            </div>
            <div class="game-title">SPACE WAVES</div>
        </div>
    </div>

    <script>
        function startSigmaGame(btn, url) {
            const frame = btn.nextElementSibling;
            btn.style.display = 'none';
            frame.style.display = 'block';
            frame.src = url;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma Edition Hub</title>
    <style>
        :root { 
            --primary: #00d4ff; 
            --bg: #0b0e14; 
            --card-bg: #1c2128; 
            --border: #30363d;
        }

        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }

        header { 
            padding: 40px; 
            background: #161b22; 
            border-bottom: 3px solid var(--primary); 
            margin-bottom: 50px;
        }

        .game-grid { 
            display: flex; 
            justify-content: center; 
            gap: 30px; 
            flex-wrap: wrap; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        .game-card { 
            background: var(--card-bg); 
            border: 2px solid var(--border); 
            border-radius: 20px; 
            width: 350px; 
            height: 450px; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .game-card:hover { 
            transform: translateY(-10px); 
            border-color: var(--primary); 
        }

        .game-view { 
            position: relative; 
            flex-grow: 1; 
            background: #000; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: none; 
        }

        .play-btn { 
            padding: 15px 40px; 
            background: var(--primary); 
            color: #000; 
            border: none; 
            border-radius: 12px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 18px; 
            text-transform: uppercase;
        }

        .play-btn:hover { 
            background: white; 
            box-shadow: 0 0 15px var(--primary); 
        }

        .footer { 
            padding: 20px; 
            background: #161b22; 
            color: var(--primary); 
            font-weight: bold; 
            font-size: 20px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <header>
        <h1>SIGMA EDITION HUB</h1>
    </header>

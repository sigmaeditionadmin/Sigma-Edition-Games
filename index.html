<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma Edition Hub</title>
    <style>
        :root { 
            --primary: #00d4ff; 
            --bg: #0b0e14; 
            --card-bg: #1c2128; 
            --border: #30363d;
        }

        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }

        header { 
            padding: 40px; 
            background: #161b22; 
            border-bottom: 3px solid var(--primary); 
            margin-bottom: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .game-grid { 
            display: flex; 
            justify-content: center; 
            gap: 30px; 
            flex-wrap: wrap; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        .game-card { 
            background: var(--card-bg); 
            border: 2px solid var(--border); 
            border-radius: 20px; 
            width: 350px; 
            height: 450px; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .game-card:hover { 
            transform: translateY(-10px); 
            border-color: var(--primary); 
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }

        .game-view { 
            position: relative; 
            flex-grow: 1; 
            background: #000; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: none; 
        }

        .play-btn { 
            padding: 15px 45px; 
            background: var(--primary); 
            color: #000; 
            border: none; 
            border-radius: 12px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 18px; 
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
        }

        .play-btn:hover { 
            background: #fff; 
            transform: scale(1.05);
        }

        .footer { 
            padding: 20px; 
            background: #161b22; 
            color: var(--primary); 
            font-weight: bold; 
            font-size: 22px;
            text-shadow: 0 0 5px rgba(0, 212, 255, 0.5);
        }
    </style>
</head>
<body>

    <header>
        <h1>SIGMA EDITION HUB</h1>
    </header>

    <div class="game-grid">
        <div class="game-card">
            <div class="game-view">
                <button class="play-btn" 
                    onclick="this.style.display='none'; const f=this.nextElementSibling; f.style.display='block'; f.src='./veck/index.html';">
                    PLAY VECK
                </button>
                <iframe allow="fullscreen"></iframe>
            </div>
            <div class="footer">VECK.IO</div>
        </div>

        <div class="game-card">
            <div class="game-view">
                <button class="play-btn" 
                    onclick="this.style.display='none'; const f=this.nextElementSibling; f.style.display='block'; f.src='./slope/index.html';">
                    PLAY SLOPE
                </button>
                <iframe allow="fullscreen"></iframe>
            </div>
            <div class="footer">SLOPE</div>
        </div>
    </div>

</body>
</html>

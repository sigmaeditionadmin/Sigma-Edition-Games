<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sigma Hub | 2026</title>
    <style>
        :root { --primary: #00d4ff; --bg: #0b0e14; --card-bg: #1c2128; }
        body { background: var(--bg); color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        
        .game-grid { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin-top: 50px; }
        
        /* The whole card is now the button */
        .game-card { 
            background: var(--card-bg); border: 2px solid #30363d; border-radius: 20px; 
            width: 350px; height: 450px; overflow: hidden; cursor: pointer;
            transition: all 0.3s ease; position: relative;
        }
        .game-card:hover { border-color: var(--primary); transform: scale(1.02); box-shadow: 0 0 20px rgba(0,212,255,0.2); }

        .game-view { width: 100%; height: 350px; background: #000; display: flex; align-items: center; justify-content: center; }
        
        iframe { width: 100%; height: 100%; border: none; display: none; }

        .play-overlay { 
            position: absolute; color: var(--primary); font-weight: bold; font-size: 24px;
            text-transform: uppercase; letter-spacing: 2px;
        }

        .footer { padding: 20px; background: #161b22; color: var(--primary); font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

    <h1>SIGMA EDITION HUB</h1>

    <div class="game-grid">
        <div class="game-card" onclick="this.querySelector('.play-overlay').style.display='none'; const f=this.querySelector('iframe'); f.style.display='block'; f.src='./slope/index.html';">
            <div class="game-view">
                <div class="play-overlay">▶ Click to Play</div>
                <iframe allow="fullscreen"></iframe>
            </div>
            <div class="footer">SLOPE</div>
        </div>

        <div class="game-card" style="opacity: 0.4; cursor: default;">
            <div class="game-view">
                <div class="play-overlay" style="color: #666;">Locked</div>
            </div>
            <div class="footer">SPACE WAVES</div>
        </div>
    </div>

</body>
</html>

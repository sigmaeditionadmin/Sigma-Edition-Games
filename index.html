<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma Edition | 2026 Gaming Hub</title>
    <style>
        /* CSS: Sigma Edition 2026 Dark Theme */
        :root {
            --primary: #00d4ff; /* Neon Blue */
            --secondary: #6e45e2; /* Purple */
            --bg: #0b0e14;
            --card-bg: #1c2128;
            --text: #f0f6fc;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%);
            margin-bottom: 40px;
        }

        h1 { margin: 0; font-size: 3rem; text-transform: uppercase; letter-spacing: 2px; }
        .subtitle { opacity: 0.9; font-weight: 300; margin-top: 10px; }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .game-card {
            background: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .game-card:hover {
            transform: scale(1.03);
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
        }

        /* Responsive 16:9 Game Box */
        .game-box {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            background: #000;
        }

        .game-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .game-label {
            padding: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            background: #161b22;
        }

        footer {
            text-align: center;
            padding: 40px;
            margin-top: 60px;
            border-top: 1px solid #30363d;
            opacity: 0.5;
        }
    </style>
</head>
<body>

<header>
    <h1>SIGMA EDITION</h1>
    <p class="subtitle">Premium Games Hub • Updated February 2026</p>
</header>

<div class="container">

        <div class="game-card">

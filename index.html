<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sigma Edition Hub</title>
    <style>
        :root { --primary: #00d4ff; --bg: #0b0e14; --card-bg: #1c2128; }
        body { background: var(--bg); color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        header { padding: 30px; margin-bottom: 40px; background: #161b22; border-bottom: 3px solid var(--primary); }
        .game-grid { display: flex; justify-content: center; gap: 25px; flex-wrap: wrap; max-width: 1200px; margin: 0 auto; }
        .game-card { background: var(--card-bg); border: 2px solid #30363d; border-radius: 15px; width: 320px; height: 400px; overflow: hidden; display: flex; flex-direction: column; }
        .game-view { position: relative; flex-grow: 1; background: #000; display: flex; align-items: center; justify-content: center; }
        iframe { width: 100%; height: 100%; border: none; display: none; }
        .play-btn { padding: 15px 35px; background: var(--primary); color: #000; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 18px; }
        .footer { padding: 15px; background: #161b22; color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>
    <header><h1>SIGMA EDITION HUB</h1></header>
    <div class="game-grid">
        <div class="game-card">
            <div class="game-view">
                <button class="play-btn" onclick="this.style.display='none'; const f=this.nextElementSibling; f.style.display='block'; f.src='slope/index.html';">PLAY SLOPE</button>
                <iframe allow="fullscreen"></iframe>
            </div>
            <div class="footer">SLOPE</div>
        </div>
    </div>
</body>
</html>

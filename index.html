<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma Edition | Game Hub</title>
    <style>
        :root { --primary: #00d4ff; --bg: #0b0e14; --card-bg: #1c2128; --text: #f0f6fc; }
        body { background-color: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; text-align: center; }
        header { padding: 40px; background: linear-gradient(135deg, #6e45e2, var(--primary)); border-radius: 20px; margin-bottom: 30px; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .game-card { background: var(--card-bg); border-radius: 15px; border: 1px solid #30363d; overflow: hidden; position: relative; height: 350px; }
        .game-box { position: relative; width: 100%; height: 280px; background: #000; display: flex; align-items: center; justify-content: center; }
        
        /* The iframe starts hidden so the hub looks clean */
        .game-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; display: none; }
        
        .play-btn { padding: 15px 30px; background: var(--primary); color: #000; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; z-index: 10; font-size: 18px; }
        .game-label { padding: 15px; font-weight: bold; background: #161b22; color: var(--primary); }
    </style>
</head>
<body>

<header>
    <h1>SIGMA EDITION HUB</h1>
    <p>Select a game to start playing</p>
</header>

<div class="game-grid">
    <div class="game-card">
        <div class="game-box">
            <button class="play-btn" onclick="activateGame(this, './slope/index.html')">PLAY SLOPE</button>
            <iframe allow="fullscreen"></iframe>
        </div>
        <div class="game-label">Slope (Sigma Lite)</div>
    </div>

    <div class="game-card">
        <div class="game-box">
            <button class="play-btn" style="background: #333; cursor: not-allowed;">COMING SOON</button>
        </div>
        <div class="game-label">Future Game</div>
    </div>
</div>

<script>
    function activateGame(btn, url) {
        // Find the iframe next to the button
        const iframe = btn.nextElementSibling;
        
        // Show the iframe and load the game
        iframe.src = url;
        iframe.style.display = "block";
        
        // Hide the play button so it's not in the way
        btn.style.display = "none";
    }
</script>

</body>
</html>

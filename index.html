<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma Edition Hub</title>
    <style>
        :root { 
            --primary: #00d4ff; 
            --bg: #0b0e14; 
            --card-bg: #1c2128; 
            --border: #30363d;
        }

        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }

        header { 
            padding: 40px; 
            background: #161b22; 
            border-bottom: 3px solid var(--primary); 
            margin-bottom: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .game-grid { 
            display: flex; 
            justify-content: center; 
            gap: 30px; 
            flex-wrap: wrap; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        .game-card { 
            background: var(--card-bg); 
            border: 2px solid var(--border); 
            border-radius: 20px; 
            width: 350px; 
            height: 450px; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .game-card:hover { 
            transform: translateY(-10px); 
            border-color: var(--primary); 
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }

        .game-view { 
            position: relative; 
            flex-grow: 1; 
            background: #000; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: none; 
        }

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma Edition | 2026 Gaming Hub</title>
    <style>
        :root { --primary: #00d4ff; --bg: #0b0e14; --card-bg: #1c2128; --text: #f0f6fc; }
        body { background-color: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; text-align: center; }
        header { padding: 40px; background: linear-gradient(135deg, #6e45e2, var(--primary)); border-radius: 20px; margin-bottom: 30px; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .game-card { background: var(--card-bg); border-radius: 15px; border: 1px solid #30363d; overflow: hidden; }
        .game-box { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; background: #000; }
        
        /* The Secret Sauce: This makes the game wait for a click */
        .game-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; display: none; }
        .play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 15px 30px; background: var(--primary); color: #000; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; z-index: 10; }
        
        .game-label { padding: 15px; font-weight: bold; font-size: 1.1rem; background: #161b22; color: var(--primary); }
    </style>
</head>
<body>

<header>
    <h1>SIGMA EDITION HUB</h1>
    <p>Click "Play" to Start a Game</p>
</header>

<div class="game-grid">

    <div class="game-card">
        <div class="game-box">
            <button class="play-btn" onclick="startGame(this, 'https://bloxd.io/')">PLAY BLOXD</button>
            <iframe allow="gamepad *; fullscreen *;"></iframe>
        </div>
        <div class="game-label">Bloxd.io</div>
    </div>

    <div class="game-card">
        <div class="game-box">
            <button class="play-btn" onclick="startGame(this, 'https://edumaths.github.io/v3/spacewaves/')">PLAY SPACE WAVES</button>
            <iframe allow="fullscreen *;"></iframe>
        </div>
        <div class="game-label">Space Waves</div>
    </div>

    <div class="game-card">
        <div class="game-box">
            <button class="play-btn" onclick="startGame(this, 'https://classroom-google-com.github.io/pixel-warfare/')">PLAY PIXEL WARFARE</button>
            <iframe allow="gamepad *; fullscreen *;"></iframe>
        </div>
        <div class="game-label">Pixel Warfare</div>
    </div>

    <div class="game-card">
        <div class="game-box">
            <button class="play-btn" onclick="startGame(this, 'https://mathplayground.github.io/slope/')">PLAY SLOPE</button>
            <iframe allow="fullscreen *;"></iframe>
        </div>
        <div class="game-label">Slope</div>
    </div>

</div>

<script>
    // This function tells the iframe to load ONLY when the button is clicked
    function startGame(btn, url) {
        const iframe = btn.nextElementSibling;
        iframe.src = url;
        iframe.style.display = "block";
        btn.style.display = "none";
    }
</script>

</body>
</html>

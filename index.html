<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma Edition | Gaming Hub</title>
    <style>
        :root {
            --primary: #00d4ff;
            --secondary: #6e45e2;
            --bg: #0b0e14;
            --card-bg: #1c2128;
            --text: #f0f6fc;
        }
        body { background-color: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; text-align: center; }
        header { padding: 40px; background: linear-gradient(135deg, var(--secondary), var(--primary)); border-radius: 20px; margin-bottom: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .game-card { background: var(--card-bg); border-radius: 15px; border: 1px solid #30363d; overflow: hidden; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .game-card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .game-box { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; background: #000; }
        .game-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .game-label { padding: 15px; font-weight: bold; font-size: 1.1rem; background: #161b22; color: var(--primary); }
    </style>
</head>
<body>

<header>
    <h1>SIGMA EDITION GAMES</h1>
    <p>Premium Unblocked Access • 2026</p>
</header>

<div class="game-grid">

    <div class="game-card">
        <div class="game-box">
            <iframe src="https://bloxd.io" allow="gamepad *; fullscreen *;"></iframe>
        </div>
        <div class="game-label">Bloxd.io</div>
    </div>

    <div class="game-card">
        <div class="game-box">
            <iframe src="https://edumaths.github.io/v3/spacewaves/" allow="fullscreen *;"></iframe>
        </div>
        <div class="game-label">Space Waves</div>
    </div>

    <div class="game-card">
        <div class="game-box">
            <iframe src="https://classroom-google-com.github.io/pixel-warfare/" allow="gamepad *; fullscreen *;"></iframe>
        </div>
        <div class="game-label">Pixel Warfare</div>
    </div>

    <div class="game-card">
        <div class="game-box">
            <iframe src="https://mathplayground.github.io/slope/" allow="fullscreen *;"></iframe>
        </div>
        <div class="game-label">Slope</div>
    </div>

    <div class="game-card">
        <div class="game-box">
            <iframe src="https://ubg77.github.io/update/motox3m/" allow="fullscreen *;"></iframe>
        </div>
        <div class="game-label">Moto X3M</div>
    </div>

    <div class="game-card">
        <div class="game-box">
            <iframe src="https://76games.github.io/ragdoll-archers/" allow="gamepad *; fullscreen *;"></iframe>
        </div>
        <div class="game-label">Ragdoll Archers</div>
    </div>

</div>

<footer>
    <p>&copy; 2026 Sigma Edition AI | High-Speed Proxy Enabled</p>
</footer>

</body>
</html>

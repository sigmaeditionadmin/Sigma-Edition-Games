<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma Edition | 2026 Gaming Hub</title>
    <style>
        :root {
            --primary: #00d4ff;
            --secondary: #6e45e2;
            --bg: #0b0e14;
            --card-bg: #1c2128;
            --text: #f0f6fc;
        }
        body { background-color: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 0; }
        header { text-align: center; padding: 50px 20px; background: linear-gradient(135deg, var(--secondary), var(--primary)); clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%); }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }
        .game-card { background: var(--card-bg); border: 1px solid #30363d; border-radius: 20px; overflow: hidden; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .game-card:hover { transform: scale(1.03); border-color: var(--primary); }
        .game-box { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; background: #000; }
        .game-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .game-label { padding: 20px; text-align: center; font-weight: bold; font-size: 1.2rem; background: #161b22; }
    </style>
</head>
<body>

<header>
    <h1>SIGMA EDITION</h1>
    <p>Premium 2026 Gaming Hub</p>
</header>

<div class="container">
    <div class="game-grid">

        <div class="game-card">
            <div class="game-box">
                <iframe src="https://www.crazygames.com/embed/bloxd-io" allow="gamepad *; fullscreen *;"></iframe>
            </div>
            <div class="game-label">Bloxd.io</div>
        </div>

        <div class="game-card">
            <div class="game-box">
                <iframe src="https://www.crazygames.com/embed/ragdoll-archers" allow="gamepad *; fullscreen *;"></iframe>
            </div>
            <div class="game-label">Ragdoll Archers</div>
        </div>

        <div class="game-card">
            <div class="game-box">
                <iframe src="https://www.crazygames.com/embed/space-waves" allow="gamepad *; fullscreen *;"></iframe>
            </div>
            <div class="game-label">Space Waves</div>
        </div>

        <div class="game-card">
            <div class="game-box">
                <iframe src="https://www.crazygames.com/embed/pixel-warfare" allow="gamepad *; fullscreen *;"></iframe>
            </div>
            <div class="game-label">Pixel Warfare</div>
        </div>

        <div class="game-card">
            <div class="game-box">
                <iframe src="https://www.crazygames.com/embed/slope" allow="gamepad *; fullscreen *;"></iframe>
            </div>
            <div class="game-label">Slope</div>
        </div>

        <div class="game-card">
            <div class="game-box">
                <iframe src="https://www.crazygames.com/embed/moto-x3m" allow="gamepad *; fullscreen *;"></iframe>
            </div>
            <div class="game-label">Moto X3M</div>
        </div>

    </div>
</div>

</body>
</html>
